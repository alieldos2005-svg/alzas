<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Приглашение на свидание</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --rose-50:#fff5f8;
  --rose-100:#ffe3ee;
  --rose-200:#ffc9dd;
  --rose-400:#f486ae;
  --rose-500:#ea5b8f;
  --rose-600:#d43f78;
  --rose-700:#b52c63;
  --lav-100:#ede3fc;
  --lav-300:#cdb6f4;
  --lav-500:#a888e8;
  --gold-400:#ffcf6b;
  --plum-900:#3a2140;
  --ink:#4a2e46;
  --ink-soft:#93758e;
  --card-bg:#fffcfd;
  --page-bg:#fbe9f1;
  --grey-btn:#f1e7ee;
  --grey-btn-ink:#8a7186;
}
:root[data-theme="dark"]{
  --card-bg:#241a29;
  --page-bg:#1b1220;
  --ink:#f7ecf3;
  --ink-soft:#c8abc2;
  --grey-btn:#372a3d;
  --grey-btn-ink:#d3bccd;
  --rose-50:#2a1c26;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --card-bg:#241a29;
    --page-bg:#1b1220;
    --ink:#f7ecf3;
    --ink-soft:#c8abc2;
    --grey-btn:#372a3d;
    --grey-btn-ink:#d3bccd;
    --rose-50:#2a1c26;
  }
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;min-height:100%;}
body{
  font-family:'Nunito', system-ui, -apple-system, sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 10% 10%, var(--lav-100) 0%, transparent 38%),
    radial-gradient(circle at 92% 18%, var(--rose-100) 0%, transparent 34%),
    radial-gradient(circle at 15% 92%, var(--rose-100) 0%, transparent 30%),
    var(--page-bg);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:34px 16px 46px;
  position:relative;
  overflow-x:hidden;
}

/* ambient floating decor behind everything */
.ambient{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;}
.ambient span{
  position:absolute;
  opacity:.5;
  font-size:22px;
  animation: drift 14s ease-in-out infinite;
  filter: blur(.2px);
}
@keyframes drift{
  0%,100%{ transform: translateY(0) rotate(0deg); }
  50%{ transform: translateY(-26px) rotate(10deg); }
}

.stage{
  width:100%;
  max-width:400px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:26px;
  position:relative;
  z-index:1;
}

.brand{
  font-family:'Comfortaa', sans-serif;
  font-weight:700;
  font-size:13px;
  letter-spacing:.02em;
  color:var(--rose-600);
  display:flex;
  align-items:center;
  gap:6px;
  opacity:.85;
}

/* ---------- progress ---------- */
.progress-wrap{
  width:100%;
  max-width:300px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
}
.progress{
  position:relative;
  width:100%;
  height:22px;
  display:flex;
  align-items:center;
}
.progress-track{
  width:100%;
  height:7px;
  background: var(--rose-100);
  border-radius:99px;
  position:relative;
  overflow:visible;
  box-shadow: inset 0 1px 2px rgba(180,60,110,.15);
}
.progress-fill{
  height:100%;
  background: linear-gradient(90deg, var(--lav-500), var(--rose-500), var(--rose-600));
  border-radius:99px;
  width:0%;
  transition: width .6s cubic-bezier(.65,0,.35,1);
}
.progress-heart{
  position:absolute;
  top:50%; left:0%;
  transform:translate(-50%,-50%);
  font-size:22px;
  transition: left .6s cubic-bezier(.65,0,.35,1);
  animation: heartbeat 1.6s ease-in-out infinite;
  filter: drop-shadow(0 3px 5px rgba(200,60,110,.45));
}
@keyframes heartbeat{
  0%,100%{ transform:translate(-50%,-50%) scale(1); }
  50%{ transform:translate(-50%,-50%) scale(1.16); }
}
.progress-steps{
  display:flex;
  justify-content:space-between;
  width:100%;
  font-size:10px;
  font-weight:700;
  color:var(--ink-soft);
  letter-spacing:.01em;
}
.progress-steps span.done{ color: var(--rose-600); }

/* ---------- phone ---------- */
.phone-shell{
  position:relative;
  width:300px;
  height:620px;
  filter: drop-shadow(0 30px 50px -18px rgba(170,45,100,.45));
}
.phone-border{
  position:absolute; inset:0;
  clip-path: url(#clipOuter);
  background: linear-gradient(160deg, var(--lav-300), var(--rose-400) 55%, var(--rose-600));
}
.phone-border::after{
  content:"";
  position:absolute; inset:0;
  background: radial-gradient(circle at 25% 10%, rgba(255,255,255,.55), transparent 40%);
  mix-blend-mode: screen;
}
.phone-inner{
  position:absolute; inset:0;
  clip-path: url(#clipInner);
  background: var(--card-bg);
}
.phone-notch{
  position:absolute;
  top:22px; left:50%;
  transform:translateX(-50%);
  width:92px; height:20px;
  background: var(--plum-900);
  border-radius:99px;
  z-index:6;
  opacity:.9;
}
.phone-notch::before{
  content:"";
  position:absolute;
  right:14px; top:50%;
  transform:translateY(-50%);
  width:7px; height:7px;
  border-radius:50%;
  background:#2c3e6b;
}

.screen{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:58px 22px 26px;
  text-align:center;
  overflow:hidden;
  background:
    radial-gradient(circle at 12% 6%, var(--lav-100) 0%, transparent 32%),
    radial-gradient(circle at 92% 92%, var(--rose-100) 0%, transparent 36%),
    var(--rose-50);
}
.confetti-layer{ position:absolute; inset:0; pointer-events:none; z-index:5; overflow:hidden; }
.confetti-layer span{
  position:absolute;
  top:-20px;
  font-size:15px;
  animation: fall linear forwards;
}
@keyframes fall{
  to{ transform: translateY(680px) rotate(340deg); opacity:0; }
}

.deco-cloud{ position:absolute; color:var(--lav-300); opacity:.6; pointer-events:none; z-index:1;}
.deco-sparkle{ position:absolute; color:var(--gold-400); opacity:.8; pointer-events:none; z-index:1; animation: twinkle 2.4s ease-in-out infinite;}
@keyframes twinkle{ 0%,100%{opacity:.25; transform:scale(.8);} 50%{opacity:.9; transform:scale(1.1);} }

.illustration{ margin-bottom:8px; position:relative; z-index:2; }
.illustration svg{ display:block; }

h1.title{
  font-family:'Comfortaa', sans-serif;
  font-weight:700;
  font-size:20px;
  line-height:1.32;
  margin: 4px 0 6px;
  color:var(--ink);
  position:relative;
  z-index:2;
}
p.sub{
  margin:0 0 16px;
  font-size:13.5px;
  color:var(--ink-soft);
  line-height:1.55;
  position:relative;
  z-index:2;
  max-width:230px;
}
.script-note{
  font-family:'Caveat', cursive;
  font-size:19px;
  color:var(--rose-600);
  font-weight:700;
  margin: -4px 0 10px;
  position:relative;
  z-index:2;
}

.spacer{ flex:1; min-height:6px; }

.btn{
  appearance:none; border:none;
  width:100%; max-width:226px;
  padding:14px 18px;
  border-radius:18px;
  font-family:'Nunito', sans-serif;
  font-weight:800;
  font-size:14.5px;
  cursor:pointer;
  position:relative; z-index:2;
  transition: transform .15s ease, filter .15s ease, box-shadow .15s ease;
}
.btn:active{ transform:scale(.96); }
.btn-pink{
  color:#fff;
  background: linear-gradient(135deg, var(--rose-500), var(--rose-700));
  box-shadow: 0 14px 26px -10px rgba(180,40,100,.6), inset 0 1px 0 rgba(255,255,255,.35);
}
.btn-pink:hover{ filter:brightness(1.05); }
.btn-grey{
  background: var(--grey-btn);
  color: var(--grey-btn-ink);
  box-shadow: inset 0 0 0 1px rgba(180,120,160,.15);
}
.btn-row{
  display:flex; flex-direction:column; gap:10px;
  width:100%; align-items:center;
  margin-top:auto;
  position:relative; z-index:2;
}

/* ---------- scratch ---------- */
.scratch-screen{ padding:0 !important; }
.scratch-wrap{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; z-index:1;}
.scratch-label{
  font-family:'Comfortaa', sans-serif; font-weight:700; font-size:21px; color:#fff;
  text-shadow:0 3px 10px rgba(70,20,50,.35);
}
.scratch-hand{ font-size:26px; animation: swipe 1.6s ease-in-out infinite; }
@keyframes swipe{
  0%,100%{ transform:translateX(-16px) rotate(-6deg); }
  50%{ transform:translateX(16px) rotate(6deg); }
}
canvas#scratchCanvas{ position:absolute; inset:0; z-index:2; touch-action:none; cursor:grab; }
.hint{ position:absolute; bottom:24px; left:0; right:0; text-align:center; color:#fff; font-size:12px; font-weight:700; opacity:.9; z-index:3; }

/* ---------- toast ---------- */
.toast{
  position:absolute; left:50%; bottom:104px;
  transform:translate(-50%,14px);
  background:var(--card-bg); color:var(--ink);
  padding:10px 16px; border-radius:16px;
  font-size:12.5px; font-weight:800;
  box-shadow:0 14px 26px -10px rgba(150,50,100,.5);
  display:flex; align-items:center; gap:8px;
  opacity:0; pointer-events:none;
  transition: opacity .25s ease, transform .25s ease;
  z-index:9; white-space:nowrap;
}
.toast.show{ opacity:1; transform:translate(-50%,0); }
.toast .kiss{ font-size:19px; animation:pop .5s ease; }
@keyframes pop{ 0%{transform:scale(.3) rotate(-15deg);} 60%{transform:scale(1.25) rotate(8deg);} 100%{transform:scale(1) rotate(0);} }
.shake{ animation: shakeAnim .4s ease; }
@keyframes shakeAnim{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-6px);} 40%{transform:translateX(6px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(4px);} }

/* ---------- date/time card ---------- */
.field-card{
  width:100%;
  background: var(--card-bg);
  border-radius:20px;
  padding:14px 16px 16px;
  box-shadow: 0 8px 20px -12px rgba(180,60,110,.3), inset 0 0 0 1px var(--rose-100);
  position:relative; z-index:2;
  margin-bottom:14px;
}
.field{ text-align:left; margin-bottom:10px; }
.field:last-child{ margin-bottom:0; }
.field label{
  display:flex; align-items:center; gap:6px;
  font-size:11.5px; font-weight:800; color:var(--ink-soft);
  margin-bottom:5px; margin-left:2px; text-transform:uppercase; letter-spacing:.03em;
}
.field input{
  width:100%; padding:10px 12px; border-radius:13px;
  border:1.5px solid var(--rose-100); background:var(--rose-50);
  font-family:'Nunito', sans-serif; font-size:14px; font-weight:800; color:var(--ink);
}
.field input:focus{ outline:2px solid var(--rose-500); outline-offset:1px; background:var(--card-bg); }
.preview-chip{
  margin-top:4px;
  display:inline-flex; align-items:center; gap:6px;
  background: linear-gradient(135deg, var(--rose-100), var(--lav-100));
  color:var(--rose-700); font-weight:800; font-size:12px;
  padding:7px 13px; border-radius:99px;
  position:relative; z-index:2;
}

/* ---------- choice ---------- */
.tabs{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-bottom:14px; position:relative; z-index:2;}
.tab{
  padding:7px 11px; border-radius:13px; background:var(--grey-btn); color:var(--grey-btn-ink);
  font-size:11.5px; font-weight:800; cursor:pointer; display:flex; align-items:center; gap:4px;
  transition: background .15s ease, color .15s ease;
}
.tab.active{ background: linear-gradient(135deg, var(--rose-500), var(--rose-700)); color:#fff; }
.grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; width:100%; margin-bottom:14px; position:relative; z-index:2;}
.tile{
  background: var(--card-bg);
  border:2px solid transparent;
  border-radius:16px;
  padding:12px 6px 10px;
  display:flex; flex-direction:column; align-items:center; gap:7px;
  cursor:pointer;
  box-shadow: 0 8px 18px -10px rgba(180,60,110,.3);
  transition: border-color .15s ease, transform .12s ease;
  font-size:12px; font-weight:800; color:var(--ink);
  position:relative;
}
.tile-badge{
  width:38px; height:38px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:19px;
  background: linear-gradient(135deg, var(--rose-100), var(--lav-100));
}
.tile:active{ transform:scale(.96); }
.tile.selected{ border-color:var(--rose-500); }
.tile.selected .tile-badge{ background: linear-gradient(135deg, var(--rose-500), var(--rose-700)); }
.tile.selected::after{
  content:"✓"; position:absolute; top:6px; right:8px;
  width:16px; height:16px; border-radius:50%;
  background:var(--rose-600); color:#fff; font-size:10px; font-weight:900;
  display:flex; align-items:center; justify-content:center;
}

/* ---------- final ticket ---------- */
.ticket{
  width:100%;
  background: var(--card-bg);
  border-radius:20px;
  box-shadow: 0 10px 24px -12px rgba(180,60,110,.35), inset 0 0 0 1px var(--rose-100);
  position:relative; z-index:2;
  padding:16px 16px 14px;
  margin-bottom:12px;
}
.ticket-row{
  display:flex; align-items:center; justify-content:space-between;
  font-size:12.5px; font-weight:800; color:var(--ink);
  padding:6px 0;
}
.ticket-row span.k{ color:var(--ink-soft); font-weight:700; }
.ticket-divider{
  border:none; border-top:2px dashed var(--rose-100); margin:8px 0;
}
.seal{
  position:absolute; top:-16px; right:14px;
  width:38px; height:38px; border-radius:50%;
  background: linear-gradient(135deg, var(--rose-500), var(--rose-700));
  display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px;
  box-shadow:0 8px 14px -6px rgba(180,40,100,.6);
}
.tg-field{ width:100%; text-align:left; margin-bottom:12px; position:relative; z-index:2;}

@media (max-width:360px){
  .stage{ transform: scale(.92); transform-origin: top center; margin-bottom:-40px; }
}
</style>
</head>

function confettiBurst(container, emojis, count){
  const layer = document.createElement('div');
  layer.className = 'confetti-layer';
  container.appendChild(layer);
  for(let i=0;i<count;i++){
    const s = document.createElement('span');
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left = Math.random()*94 + '%';
    s.style.animationDuration = (1.4 + Math.random()*1.2) + 's';
    s.style.animationDelay = (Math.random()*.6) + 's';
    s.style.fontSize = (12 + Math.random()*10) + 'px';
    layer.appendChild(s);
  }
  setTimeout(()=> layer.remove(), 3200);
}

  const box = document.getElementById('ambient');

  else if(state.step === 5) renderChoice();
  else if(state.step === 6) renderFinal();

function renderScratch(){
  screenEl.classList.add('scratch-screen');
  screenEl.innerHTML = `
    <div class="scratch-wrap">
      <div class="scratch-label">Сотри меня ✨</div>
      <div class="scratch-hand">👉</div>
    </div>
    <canvas id="scratchCanvas"></canvas>
    <div class="hint">проведи пальцем по всему экрану</div>
  `;
  const canvas = document.getElementById('scratchCanvas');
  const rect = document.querySelector('.phone-shell').getBoundingClientRect();
  const w = rect.width, h = rect.height;
  canvas.width = w; canvas.height = h;
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
  const ctx = canvas.getContext('2d');

  const grad = ctx.createLinearGradient(0,0,w,h);
  grad.addColorStop(0,'#cdb6f4');
  grad.addColorStop(.5,'#f486ae');
  grad.addColorStop(1,'#ea5b8f');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,w,h);
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  for(let i=0;i<60;i++){
    ctx.beginPath();
    ctx.arc(Math.random()*w, Math.random()*h, Math.random()*1.6+0.4, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'destination-out';

  let drawing = false, done = false, checkScheduled = false;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return [cx, cy];
  }
  function erase(x,y){ ctx.beginPath(); ctx.arc(x,y,36,0,Math.PI*2); ctx.fill(); }
  function checkErased(){
    if(checkScheduled || done) return;
    checkScheduled = true;
    requestAnimationFrame(()=>{
      checkScheduled = false;
      const data = ctx.getImageData(0,0,w,h).data;
      let cleared=0, total=0;
      for(let i=3;i<data.length;i+=4*24){ total++; if(data[i] < 40) cleared++; }
      if(cleared/total > 0.45){
        done = true;
        confettiBurst(screenEl, ['✨','💗','💕'], 16);
        setTimeout(()=> goTo(2), 380);
      }
    });
  }
  function start(e){ drawing=true; const [x,y]=pos(e); erase(x,y); e.preventDefault(); }
  function move(e){ if(!drawing) return; const [x,y]=pos(e); erase(x,y); checkErased(); e.preventDefault(); }
  function end(){ drawing=false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
  canvas.addEventListener('click', ()=>{ if(!done){ done=true; confettiBurst(screenEl,['✨','💗'],14); setTimeout(()=>goTo(2), 300);} });
}

function formatPreview(dVal, tVal){
  if(!dVal) return '';
  const [y,m,d] = dVal.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const txt = dt.toLocaleDateString('ru-RU', {weekday:'short', day:'numeric', month:'long'});
  return `${txt}${tVal ? ' · '+tVal : ''}`;
}

    </div>
    <div class="grid" id="grid">
      ${items.map(it=>`<div class="tile ${state.choice===it?'selected':''}" data-item="${it}"><div class="tile-badge">${choiceIcons[it]}</div>${it}</div>`).join('')}
    </div>
    <div class="spacer"></div>
    <div class="btn-row" id="choiceBtnRow" style="${state.choice ? '' : 'visibility:hidden;'}">
      <button class="btn btn-pink" id="choiceNext">Готово</button>
    </div>
  `;
  document.getElementById('tabs').addEventListener('click', (e)=>{
    const tab = e.target.closest('.tab');
    if(!tab) return;
    if(tab.dataset.cat !== 'Кино'){
      const toast = document.createElement('div');
      toast.className='toast show';
      toast.style.bottom='150px';
      toast.innerHTML = '<span>✨</span><span>Этот раздел скоро появится</span>';
      screenEl.appendChild(toast);
      setTimeout(()=>toast.remove(), 1300);
      return;
    }
    document.querySelectorAll('#tabs .tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
  });
  document.getElementById('grid').addEventListener('click', (e)=>{
    const tile = e.target.closest('.tile');
    if(!tile) return;
    document.querySelectorAll('.tile').forEach(t=>t.classList.remove('selected'));
    tile.classList.add('selected');
    state.choice = tile.dataset.item;
    document.getElementById('choiceBtnRow').style.visibility = 'visible';
  });
  document.getElementById('choiceNext').onclick = ()=> goTo(6);
}

function renderFinal(){
  const icon = state.choice ? choiceIcons[state.choice] : '🎬';
  const previewDate = formatPreview(state.date, state.time);
  screenEl.innerHTML = `
    ${clouds()}
    <div class="illustration">${catIllustration('happy')}</div>
    <h1 class="title">Рада, что не отказалась</h1>
    <p class="sub" style="margin-bottom:12px;">маленькое напоминание о вечере</p>
    <div class="ticket">
      <div class="seal">💌</div>
      <div class="ticket-row"><span class="k">Когда</span><span>${previewDate}</span></div>
      <hr class="ticket-divider">
      <div class="ticket-row"><span class="k">Что смотрим</span><span>${icon} ${state.choice || '—'}</span></div>
    </div>
    <div class="tg-field">
      <div class="field">
        <label>💬 Telegram (по желанию)</label>
        <input type="text" id="tgInput" placeholder="@username" value="${state.tg}">
      </div>
    </div>
    <div class="spacer"></div>
    <div class="btn-row">
      <button class="btn btn-pink" id="saveBtn">Сохранить</button>
      <button class="btn btn-grey" id="restartBtn">Пройти ещё раз</button>
    </div>
    <div class="toast" id="saveToast"><span>💗</span><span>Сохранено!</span></div>
  `;
  confettiBurst(screenEl, ['💗','🌸','✨','💖'], 14);
  document.getElementById('tgInput').addEventListener('input', e=> state.tg = e.target.value);
  document.getElementById('saveBtn').onclick = ()=>{
    const t = document.getElementById('saveToast');
    t.classList.add('show');
    confettiBurst(screenEl, ['💗','✨'], 10);
    setTimeout(()=> t.classList.remove('show'), 1500);
  };
  document.getElementById('restartBtn').onclick = ()=>{
    state.step=1; state.noTries=0; state.choice=null; state.tg='';
    render();
  };
}

function goTo(step){ state.step = step; render(); }
render();
</script>
</body>
</html>
